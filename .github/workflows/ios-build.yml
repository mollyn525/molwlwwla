name: iOS unsigned build and core tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitkeep'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      # Only an explicitly marked verification commit narrows UI test scope.
      UI_CONFIRMATION: ${{ contains(github.event.head_commit.message, '[ui-confirmation]') }}
      UI_MONITOR_CONFIRMATION: ${{ contains(github.event.head_commit.message, '[monitor-confirmation]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize selected Xcode for simulator services
        timeout-minutes: 3
        run: |
          mkdir -p build
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -runFirstLaunch > build/xcode-first-launch.log 2>&1 || { tail -n 80 build/xcode-first-launch.log; exit 1; }
      - name: Core tests and independent export verification
        timeout-minutes: 6
        run: bash tools/build_macos.sh core
      - name: Compile simulator app
        timeout-minutes: 8
        run: bash tools/build_macos.sh simulator
      - name: Compile unsigned iPhone app
        id: device
        timeout-minutes: 6
        run: bash tools/build_macos.sh device
      - name: Unsigned app for local personal signing
        uses: actions/upload-artifact@v4
        with:
          name: baduanjin-ios-unsigned
          path: build/output/*
          if-no-files-found: error
          retention-days: 7
      - name: Run simulator workflow tests
        timeout-minutes: 35
        run: bash tools/build_macos.sh ui
      - name: Recover simulator reports after an interrupted test command
        if: always()
        timeout-minutes: 3
        run: |
          if [ -d build/ui-tests.xcresult ]; then
            if [ ! -s build/ui-test-summary.json ]; then
              xcrun xcresulttool get test-results summary --path build/ui-tests.xcresult > build/ui-test-summary.json
            fi
            if [ ! -s build/ui-screenshots/manifest.json ]; then
              xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path build/ui-screenshots
            fi
          fi
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            build/*.log
            build/*.json
            build/*.txt
            build/*.xml
            build/test-artifacts/
            build/ui-screenshots/
          retention-days: 7
